name: ci

on:
  pull_request:
  push:
    branches-ignore: [claude/dryline-mvp]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check && uv run ruff format --check
      - run: sh src/dryline/templates/design-tokens/sync.sh --check
      - run: uv run pytest -q
      - name: Site builds from the committed archive
        run: uv run dryline build --out /tmp/site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci --omit=dev
          for f in api/*.js api/_lib/*.js; do node -e "import('./$f')" || exit 1; done
