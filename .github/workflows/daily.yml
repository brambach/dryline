name: daily

# Git scraping: collect public sources each morning, apply the rules and the forecast, commit the
# snapshot and the built site. Vercel deploys site/ (and the API) from that commit.
on:
  schedule:
    - cron: "40 13 * * *" # 6:40am PDT / 5:40am PST
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Design tokens drift check (offline)
        run: sh src/dryline/templates/design-tokens/sync.sh --check
      - name: Tests (offline)
        run: uv run pytest -q
      - name: Collect
        run: uv run dryline collect
      - name: Build
        run: uv run dryline build
      - name: Commit snapshot
        run: |
          git config user.name "dryline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=America/Los_Angeles date +%Y-%m-%d)"
            git push
          fi
