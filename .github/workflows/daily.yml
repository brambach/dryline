name: daily

# Git scraping: collect public sources each morning, apply the rules, commit the snapshot and the
# built site. A second job publishes site/ to GitHub Pages (needs Pages set to "GitHub Actions").
on:
  schedule:
    - cron: "40 13 * * *" # 6:40am PDT / 5:40am PST
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tests (offline)
        run: uv run pytest -q
      - name: Collect
        run: uv run dryline collect
      - name: Build
        run: uv run dryline build
      - name: Commit snapshot
        run: |
          git config user.name "dryline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=America/Los_Angeles date +%Y-%m-%d)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
