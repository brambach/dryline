{#- Status glyphs, drawn here. Shape carries the meaning; color is secondary. -#}
{% macro glyph(status) -%}
<svg class="glyph g-{{ status }}" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
{%- if status == "dry" -%}
<circle cx="8" cy="8" r="6.25"/><path d="M5.3 8.3l1.8 1.8 3.7-3.9"/>
{%- elif status == "muddy" -%}
<circle cx="8" cy="8" r="6.25"/><path d="M4.7 8.7c1.1-1.3 2.2-1.3 3.3 0s2.2 1.3 3.3 0"/>
{%- elif status == "snow" -%}
<path d="M8 2.6v10.8M3.3 5.3l9.4 5.4M3.3 10.7l9.4-5.4"/>
{%- elif status == "closed" -%}
<circle cx="8" cy="8" r="6.25"/><path d="M3.6 12.4l8.8-8.8"/>
{%- else -%}
<circle cx="8" cy="8" r="6.25" stroke-dasharray="2.1 2.3"/>
{%- endif -%}
</svg>
{%- endmacro %}
