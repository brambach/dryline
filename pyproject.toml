[project]
name = "dryline"
version = "0.1.0"
description = "Daily Tahoe trail conditions digest: every claim cited, no source means unknown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
]

[project.scripts]
dryline = "dryline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "feedparser>=6.0",
    "playwright>=1.47",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
markers = ["browser: launches Chromium (local only, allowed to open sockets on localhost)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
